<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../src/components/cases/devices.css" />
    <link rel="stylesheet" href="base.css" />
    <!-- Eén iPhone, groot en licht gedraaid (met dikte): voor sites met maar één scherm. -->
    <style>
      body { --W: 1200px; --H: 800px; --gx: 50%; --gy: 50%; }
      .scene { perspective: 2400px; perspective-origin: 50% 30%; }
      .phone { position: absolute; left: 470px; top: 72px; width: 290px; transform: rotateY(-22deg) rotateX(6deg) rotateZ(-2deg); }
      .drop { position: absolute; left: 470px; top: 690px; width: 300px; height: 40px; border-radius: 50%; filter: blur(18px);
        background: rgba(var(--dx-shade), calc(var(--dx-contact) * 0.55)); }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="drop"></div>
    <div class="scene">
      <div class="phone" data-dx="phone" data-shot="mob" data-depth="11" data-floor="0"></div>
    </div>
    <div class="grain"></div>
    <script src="devices.js"></script>
    <script src="stage.js"></script>
  </body>
</html>
