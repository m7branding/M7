<!-- =====================================================================
     ICEWALL — EL ATLAS  ·  Cinematic island-map experience
     ---------------------------------------------------------------------
     A live, vector recreation of the ICEWALL world map. A scroll-driven
     camera flies from the full overview, dives to the 1,000-piece ICE
     WALL, fractures it open, then glides island to island — each a real
     place-name from "El mundo más allá del Muro de Hielo."

     Paste this whole block into a Webflow "Embed" element placed in its
     own full-width, full-height section. Self-contained: all styles are
     scoped to `.iw-atlas`, no external JS, no external images. The two
     brand faces (Omnium Wide / Omnium) are inlined so it renders the same
     everywhere; on the live site Webflow's own Omnium will also apply.

     Wire the final CTA: search for  data-cta-link  and set the href.
     ===================================================================== -->
<section class="iw-atlas" id="icewall-atlas" aria-label="ICEWALL — the atlas of islands beyond the wall">

  <div class="iw-atlas__sticky">

    <!-- deep space (fixed, parallax) -->
    <div class="iw-atlas__space" aria-hidden="true">
      <canvas class="iw-atlas__stars"></canvas>
      <div class="iw-atlas__nebula"></div>
    </div>

    <!-- the porthole onto the world -->
    <div class="iw-atlas__porthole" aria-hidden="true">
      <div class="iw-atlas__world" id="iwWorld">
        <svg class="iw-atlas__map" id="iwMap" viewBox="0 0 3200 3200" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>

    <div class="iw-atlas__scrim" id="iwScrim" aria-hidden="true"></div>
    <div class="iw-atlas__vignette" aria-hidden="true"></div>
    <div class="iw-atlas__grain" aria-hidden="true"></div>

    <!-- chrome -->
    <div class="iw-atlas__chrome iw-atlas__chrome--tl">
      <span class="iw-atlas__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3.2 L12 20.8"/></svg>
      </span>
      <span class="iw-atlas__word">ICEWALL<i>·</i>EL&nbsp;ATLAS</span>
    </div>
    <div class="iw-atlas__chrome iw-atlas__chrome--tr">
      <span class="iw-atlas__count"><em id="iwNow">00</em><span id="iwTot">/ 16</span></span>
    </div>

    <!-- meridian / progress spine -->
    <nav class="iw-atlas__spine" id="iwSpine" aria-label="Jump to a place on the map"></nav>

    <!-- narrative cards -->
    <div class="iw-atlas__cards" id="iwCards"></div>

    <!-- scroll cue -->
    <button type="button" class="iw-atlas__cue" id="iwCue" aria-label="Begin">
      <span>SCROLL TO CROSS</span>
      <span class="iw-atlas__cue-line"></span>
    </button>

  </div>
</section>

/* ============================ SCOPE ============================ */
.iw-atlas{
  --void:#03070c;
  --void-2:#061019;
  --abyss:#08202e;
  --ice:#dceffb;
  --ice-dim:#aecadd;
  --frost:#8fb8cf;
  --frost-dim:#5f7f92;
  --glow:#4fe3ff;
  --glow-soft:#7ff0ff;
  --line:rgba(120,196,224,.16);
  --line-strong:rgba(140,214,240,.34);
  --card-w:min(30rem,42vw);

  position:relative;
  height:1700vh;                 /* = (scenes) * 100vh, set by JS-count fallback */
  margin:0;
  background:var(--void);
  color:var(--ice);
  font-family:'IWText',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  color-scheme:dark;
  isolation:isolate;
}
.iw-atlas *{box-sizing:border-box;}

.iw-atlas__sticky{
  position:sticky; top:0;
  height:100vh; width:100%;
  overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 44%, #0a1c28 0%, #05101a 42%, var(--void) 78%);
}

/* --------------------------- space --------------------------- */
.iw-atlas__space{position:absolute; inset:0; z-index:0;}
.iw-atlas__stars{position:absolute; inset:0; width:100%; height:100%;}
.iw-atlas__nebula{
  position:absolute; inset:-10%;
  background:
    radial-gradient(38% 30% at 50% 46%, rgba(28,120,150,.28), transparent 70%),
    radial-gradient(60% 44% at 50% 52%, rgba(16,58,84,.30), transparent 72%);
  mix-blend-mode:screen;
  filter:blur(6px);
  animation:iw-breathe 14s ease-in-out infinite;
}
@keyframes iw-breathe{0%,100%{opacity:.75;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}}

/* --------------------------- world --------------------------- */
.iw-atlas__porthole{position:absolute; inset:0; z-index:1; overflow:hidden;}
.iw-atlas__world{
  position:absolute; left:0; top:0;
  width:3200px; height:3200px;
  transform-origin:0 0;
  will-change:transform;
}
.iw-atlas__map{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}

/* island bob (ambient) */
.iw-isle{ transform-box:fill-box; transform-origin:center; }
.iw-isle--bob{ animation:iw-bob var(--dur,9s) ease-in-out infinite; animation-delay:var(--del,0s); }
@keyframes iw-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}

/* --------------------------- foreground --------------------------- */
.iw-atlas__scrim{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(120% 100% at 50% 48%, rgba(3,7,12,.82) 0%, rgba(3,7,12,.5) 40%, rgba(3,7,12,0) 68%);
}
.iw-atlas__vignette{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(130% 100% at 50% 46%, transparent 52%, rgba(2,6,11,.55) 82%, rgba(2,6,11,.92) 100%);
}
.iw-atlas__grain{
  position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* --------------------------- chrome --------------------------- */
.iw-atlas__chrome{
  position:absolute; z-index:6; top:clamp(1.1rem,2.4vh,2rem);
  display:flex; align-items:center; gap:.6rem;
  font-size:.7rem; letter-spacing:.24em; color:var(--frost);
}
.iw-atlas__chrome--tl{left:clamp(1.1rem,3vw,2.6rem);}
.iw-atlas__chrome--tr{right:clamp(1.1rem,3vw,2.6rem);}
.iw-atlas__mark{width:20px; height:20px; display:block;}
.iw-atlas__mark svg{width:100%; height:100%; fill:none; stroke:var(--glow); stroke-width:1.4; opacity:.9;}
.iw-atlas__word{font-family:'IWDisplay'; font-weight:800; letter-spacing:.14em; color:var(--ice); font-size:.72rem;}
.iw-atlas__word i{color:var(--glow); font-style:normal; margin:0 .35em;}
.iw-atlas__count{font-family:'IWDisplay'; font-weight:800; letter-spacing:.1em; display:flex; gap:.4em; align-items:baseline; font-variant-numeric:tabular-nums;}
.iw-atlas__count em{color:var(--glow); font-style:normal;}
.iw-atlas__count span{color:var(--frost-dim); font-size:.62rem;}

/* --------------------------- spine --------------------------- */
.iw-atlas__spine{
  position:absolute; z-index:6; left:clamp(1rem,2.6vw,2.2rem); top:50%;
  transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:.62rem;
}
.iw-atlas__node{
  --on:0;
  width:9px; height:9px; padding:0; border:0; cursor:pointer; background:none;
  display:grid; place-items:center; position:relative;
}
.iw-atlas__node::before{
  content:""; width:5px; height:5px; border-radius:50%;
  background:color-mix(in srgb, var(--frost) 42%, transparent);
  transform:scale(calc(1 + var(--on)*1.5));
  box-shadow:0 0 calc(var(--on)*10px) rgba(79,227,255,calc(var(--on)*.9));
  background:color-mix(in srgb, var(--glow) calc(var(--on)*100%), color-mix(in srgb, var(--frost) 42%, transparent));
  transition:transform .3s ease;
}
.iw-atlas__node:hover::before{background:var(--glow);}
.iw-atlas__node:focus-visible{outline:2px solid var(--glow); outline-offset:3px; border-radius:50%;}

/* --------------------------- cards --------------------------- */
.iw-atlas__cards{position:absolute; inset:0; z-index:5; pointer-events:none;}
.iw-card{
  position:absolute; left:clamp(1.3rem,5.2vw,5rem); bottom:clamp(2.2rem,9vh,5.4rem);
  width:var(--card-w); max-width:34rem;
  opacity:0; transform:translateY(16px);
  will-change:opacity,transform;
}
.iw-card--center{
  left:50%; bottom:auto; top:50%;
  width:min(42rem,86vw); text-align:center;
  transform:translate(-50%,-46%);
}
.iw-card__eyebrow{
  display:inline-flex; align-items:center; gap:.7em;
  font-size:.68rem; letter-spacing:.28em; color:var(--frost);
  margin:0 0 1.05rem;
}
.iw-card__eyebrow::before{
  content:""; width:1.9rem; height:1px; background:linear-gradient(90deg,var(--glow),transparent);
}
.iw-card--center .iw-card__eyebrow::before{display:none;}
.iw-card__title{
  font-family:'IWDisplay'; font-weight:800; color:var(--ice);
  line-height:.98; letter-spacing:.01em; text-wrap:balance;
  margin:0; font-size:clamp(2.1rem,5.2vw,4rem);
  text-shadow:0 0 40px rgba(79,227,255,.18);
}
.iw-card--place .iw-card__title{
  letter-spacing:.04em; font-size:clamp(2.4rem,6vw,5rem);
}
.iw-card--center .iw-card__title{font-size:clamp(2.6rem,7vw,5.4rem);}
.iw-card__sub{
  font-family:'IWText'; color:var(--glow-soft); font-size:.86rem;
  letter-spacing:.16em; margin:.85rem 0 0; text-transform:uppercase;
}
.iw-card__stat{
  display:flex; align-items:baseline; gap:.6em; margin:1.2rem 0 0;
  color:var(--frost);
}
.iw-card__stat em{
  font-family:'IWDisplay'; font-weight:800; font-style:normal; color:var(--ice);
  font-size:1.7rem; letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.iw-card__stat span{font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--frost-dim);}
.iw-card__body{
  margin:1.15rem 0 0; max-width:34ch;
  font-size:clamp(.95rem,1.15vw,1.06rem); line-height:1.62; color:var(--ice-dim); font-weight:300;
}
.iw-card--center .iw-card__body{margin-left:auto; margin-right:auto;}
.iw-card__cta{
  display:inline-flex; align-items:center; gap:.8em; margin-top:1.9rem;
  pointer-events:auto;
  font-family:'IWDisplay'; font-weight:800; font-size:.78rem; letter-spacing:.16em;
  color:var(--void); text-decoration:none;
  padding:.95em 1.6em; border-radius:999px;
  background:linear-gradient(180deg,#eafaff,var(--glow));
  box-shadow:0 0 34px rgba(79,227,255,.4), inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .25s ease, box-shadow .25s ease;
}
.iw-card__cta:hover{transform:translateY(-2px); box-shadow:0 6px 44px rgba(79,227,255,.55);}
.iw-card__cta:focus-visible{outline:2px solid var(--ice); outline-offset:3px;}
.iw-card__cta span{color:color-mix(in srgb,var(--void) 70%, #123); font-weight:300; letter-spacing:.06em;}

/* --------------------------- scroll cue --------------------------- */
.iw-atlas__cue{
  position:absolute; z-index:6; left:50%; bottom:clamp(1.4rem,4vh,2.6rem);
  transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:.7rem;
  background:none; border:0; cursor:pointer; padding:.4rem;
  color:var(--frost); font-family:'IWText'; font-size:.62rem; letter-spacing:.3em;
  transition:opacity .5s ease, color .25s ease;
}
.iw-atlas__cue:hover{color:var(--glow);}
.iw-atlas__cue-line{width:1px; height:2.4rem; background:linear-gradient(180deg,var(--glow),transparent); position:relative; overflow:hidden;}
.iw-atlas__cue-line::after{content:""; position:absolute; left:0; top:-40%; width:100%; height:40%; background:var(--ice); animation:iw-drop 1.9s ease-in-out infinite;}
@keyframes iw-drop{0%{top:-40%;}70%,100%{top:100%;}}
.iw-atlas__cue:focus-visible{outline:2px solid var(--glow); outline-offset:4px; border-radius:6px;}

/* --------------------------- reduced motion --------------------------- */
@media (prefers-reduced-motion:reduce){
  .iw-atlas__nebula,.iw-isle--bob,.iw-atlas__cue-line::after{animation:none;}
}
@media (max-width:640px){
  .iw-atlas{--card-w:88vw;}
  .iw-card{left:1.3rem; right:1.3rem; width:auto;}
  .iw-atlas__spine{display:none;}
}
</style>

<script>
(function(){
  "use strict";
  var root = document.getElementById('icewall-atlas');
  if(!root || root.dataset.iwInit) return; root.dataset.iwInit = '1';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var CX = 1600, CY = 1600;                 // world centre
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---------- seeded rng ---------- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  /* ---------- helpers ---------- */
  function el(name,attrs){var e=document.createElementNS(SVGNS,name);if(attrs)for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
  function pol(r,aDeg){var a=aDeg*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];}
  function lerp(a,b,t){return a+(b-a)*t;}
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function smoother(t){return t*t*t*(t*(t*6-15)+10);}

  /* wobbly closed blob path (organic landmass) */
  function blob(cx,cy,rBase,wob,pts,rng){
    var arr=[],i,a,r;
    for(i=0;i<pts;i++){a=i/pts*Math.PI*2;r=rBase*(1+ (rng()*2-1)*wob);arr.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
    var d='M'+arr[0][0].toFixed(1)+' '+arr[0][1].toFixed(1);
    for(i=0;i<pts;i++){
      var p0=arr[(i-1+pts)%pts],p1=arr[i],p2=arr[(i+1)%pts],p3=arr[(i+2)%pts];
      var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
      var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
      d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
    }
    return d+'Z';
  }

  /* =====================================================================
     MAP DATA
  ===================================================================== */
  // featured islands (in journey order) — real names from the source atlas
  var ISLES=[
    {key:'asgard',   name:'ASGARD',   a:-90, r:770,  size:168},
    {key:'thoth',    name:'THOTH',    a:-40, r:824,  size:120},
    {key:'atlantida',name:'ATLÁNTIDA',a:6,   r:884,  size:142},
    {key:'lemuria',  name:'GRAN LEMURIA', a:55, r:1004, size:206},
    {key:'horus',    name:'HORUS',    a:100, r:876,  size:120},
    {key:'amunra',   name:'AMUN·RA',  a:140, r:1030, size:150},
    {key:'aurora',   name:'AURORA',   a:178, r:900,  size:122},
    {key:'eden',     name:'EDÉN',     a:-150,r:1044, size:140,warm:1},
    {key:'terranova',name:'TERRA NOVA',a:-110,r:1180,size:140},
    {key:'mu',       name:'MU',       a:-64, r:1246, size:168},
    {key:'valhalla', name:'VALHALLA', a:-20, r:1322, size:134},
    {key:'tiffin',   name:'LA TORMENTA DE TIFFIN', a:46, r:1436, size:236, storm:1}
  ];
  // ambient islands — labelled but never focused, for cartographic richness
  var AMBIENT=[
    {name:'ANUBIS',a:-66,r:748,size:70},{name:'ORACULA',a:-118,r:812,size:64},
    {name:'GEMINIA',a:72,r:742,size:66},{name:'XENONESIA',a:26,r:1156,size:58},
    {name:'ANTILLIA',a:158,r:786,size:60},{name:'ELÍSEOS',a:120,r:1176,size:62},
    {name:'MINERVA',a:206,r:1150,size:66},{name:'POLYBIUS',a:230,r:980,size:58},
    {name:'GLARNIA',a:92,r:1352,size:70},{name:'NUEVA PAMPA',a:-40,r:1074,size:60},
    {name:'ÍTACA',a:-172,r:1210,size:56},{name:'HÉSPERO',a:14,r:1330,size:58}
  ];

  var mapEl=document.getElementById('iwMap');

  /* ---------- defs (gradients + filters) ---------- */
  var defs=el('defs');
  defs.innerHTML=
    '<radialGradient id="iwDiscGlow" cx="50%" cy="50%" r="50%">'+
      '<stop offset="0%" stop-color="#2ec6f0" stop-opacity="0.34"/>'+
      '<stop offset="46%" stop-color="#1b7fb0" stop-opacity="0.14"/>'+
      '<stop offset="100%" stop-color="#04121c" stop-opacity="0"/>'+
    '</radialGradient>'+
    '<radialGradient id="iwDisc" cx="50%" cy="46%" r="58%">'+
      '<stop offset="0%" stop-color="#0c2c3e"/>'+
      '<stop offset="55%" stop-color="#0a2130"/>'+
      '<stop offset="86%" stop-color="#14435a"/>'+
      '<stop offset="100%" stop-color="#245f79"/>'+
    '</radialGradient>'+
    '<radialGradient id="iwDome" cx="38%" cy="32%" r="72%">'+
      '<stop offset="0%" stop-color="#f2fcff"/>'+
      '<stop offset="28%" stop-color="#cdeafb"/>'+
      '<stop offset="62%" stop-color="#7fb6d4"/>'+
      '<stop offset="100%" stop-color="#123246"/>'+
    '</radialGradient>'+
    '<radialGradient id="iwDomeWarm" cx="38%" cy="32%" r="72%">'+
      '<stop offset="0%" stop-color="#fbfff2"/>'+
      '<stop offset="30%" stop-color="#daf1d6"/>'+
      '<stop offset="64%" stop-color="#84c0a6"/>'+
      '<stop offset="100%" stop-color="#123a34"/>'+
    '</radialGradient>'+
    '<radialGradient id="iwDomeGlow" cx="50%" cy="50%" r="50%">'+
      '<stop offset="0%" stop-color="#67e6ff" stop-opacity="0.55"/>'+
      '<stop offset="60%" stop-color="#2ba9d8" stop-opacity="0.14"/>'+
      '<stop offset="100%" stop-color="#2ba9d8" stop-opacity="0"/>'+
    '</radialGradient>'+
    '<linearGradient id="iwSeg" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#f4fdff"/>'+
      '<stop offset="46%" stop-color="#cfeafa"/>'+
      '<stop offset="100%" stop-color="#5f97b6"/>'+
    '</linearGradient>'+
    '<radialGradient id="iwWall" cx="50%" cy="50%" r="50%">'+
      '<stop offset="82%" stop-color="#8fbcd6" stop-opacity="0"/>'+
      '<stop offset="85%" stop-color="#bfe3f5"/>'+
      '<stop offset="93%" stop-color="#eefaff"/>'+
      '<stop offset="100%" stop-color="#a9d2e8"/>'+
    '</radialGradient>'+
    '<radialGradient id="iwStorm" cx="50%" cy="50%" r="50%">'+
      '<stop offset="0%" stop-color="#eafaff"/>'+
      '<stop offset="18%" stop-color="#bfe6f6" stop-opacity="0.9"/>'+
      '<stop offset="55%" stop-color="#4aa6cc" stop-opacity="0.5"/>'+
      '<stop offset="100%" stop-color="#0b2634" stop-opacity="0"/>'+
    '</radialGradient>'+
    '<filter id="iwSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>'+
    '<filter id="iwSoft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="42"/></filter>'+
    '<filter id="iwGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  mapEl.appendChild(defs);

  /* ---------- graticule (map grid) ---------- */
  var grat=el('g',{'stroke':'none'});
  // faint full-field rings
  var ringRs=[150,300,470,545,700,900,1100,1320,1520];
  ringRs.forEach(function(r,i){
    grat.appendChild(el('circle',{cx:CX,cy:CY,r:r,fill:'none',stroke:(i===2||i===3)?'rgba(150,220,244,.30)':'rgba(120,196,224,.10)','stroke-width':i<4?1.4:1}));
  });
  // radial spokes
  for(var s=0;s<24;s++){
    var p1=pol(150,s*15),p2=pol(1520,s*15);
    grat.appendChild(el('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],stroke:'rgba(120,196,224,.07)','stroke-width':1}));
  }
  mapEl.appendChild(grat);

  /* ---------- disc glow + disc ---------- */
  mapEl.appendChild(el('circle',{cx:CX,cy:CY,r:640,fill:'url(#iwDiscGlow)'}));
  var disc=el('circle',{cx:CX,cy:CY,r:470,fill:'url(#iwDisc)',opacity:.96});
  mapEl.appendChild(disc);

  // holographic landmasses on the disc (stylised azimuthal continents)
  var discRng=mulberry32(20260619);
  var land=el('g',{fill:'rgba(120,196,232,.13)',stroke:'rgba(168,224,248,.34)','stroke-width':1.1});
  var contN=6;
  for(var c=0;c<contN;c++){
    var ca=c/contN*360 + 12;
    var cr=lerp(150,360,discRng());
    var lp=pol(cr,ca);
    land.appendChild(el('path',{d:blob(lp[0],lp[1], lerp(70,150,discRng()), .42, 9, discRng?discRng:Math.random && mulberry32(c+7))}));
  }
  // clip land to disc
  var clip=el('clipPath',{id:'iwDiscClip'});clip.appendChild(el('circle',{cx:CX,cy:CY,r:468}));
  defs.appendChild(clip);
  land.setAttribute('clip-path','url(#iwDiscClip)');
  mapEl.appendChild(land);

  // tiny meridian coordinate ticks (cartographic texture)
  var ticks=el('g',{fill:'rgba(143,184,207,.5)','font-family':'IWText','font-size':'15','letter-spacing':'2'});
  ['15°','30°','45°','60°'].forEach(function(t,i){
    var tp=pol(140+i*82,-90);
    ticks.appendChild(el('circle',{cx:tp[0],cy:tp[1],r:2,fill:'rgba(143,184,207,.55)'}));
    var tx=el('text',{x:tp[0]+10,y:tp[1]+5});tx.textContent=t;ticks.appendChild(tx);
  });
  mapEl.appendChild(ticks);

  /* ---------- THE ICE WALL — a solid ring, scored into 1,000 pieces ---------- */
  var wallGroup=el('g',{});
  mapEl.appendChild(wallGroup);
  var SEGN=60, Rin=478, Rout=572;
  var wallRng=mulberry32(777);

  // glow rim (behind everything)
  var wallGlow=el('circle',{cx:CX,cy:CY,r:(Rin+Rout)/2,fill:'none',stroke:'rgba(120,228,255,.55)','stroke-width':40,filter:'url(#iwSoft)',opacity:.55});
  wallGroup.appendChild(wallGlow);

  // solid ice body (annulus) — makes the wall read as one continuous mass
  function ringPath(ro,ri){
    return 'M'+(CX-ro)+' '+CY+'a'+ro+' '+ro+' 0 1 0 '+(2*ro)+' 0a'+ro+' '+ro+' 0 1 0 '+(-2*ro)+' 0Z'+
           'M'+(CX-ri)+' '+CY+'a'+ri+' '+ri+' 0 1 0 '+(2*ri)+' 0a'+ri+' '+ri+' 0 1 0 '+(-2*ri)+' 0Z';
  }
  var wallBody=el('path',{d:ringPath(Rout,Rin),'fill-rule':'evenodd',fill:'url(#iwWall)',opacity:.98});
  wallGroup.appendChild(wallBody);

  // the pieces — chunky facets, tiny gaps, faint scoring; they shatter on break
  var segs=[];
  for(var i=0;i<SEGN;i++){
    var a0=i/SEGN*360, a1=(i+1)/SEGN*360, gap=0.5;
    var jag=(wallRng()*2-1)*10;            // ragged inner edge
    var pA=pol(Rin+jag,a0+gap),pB=pol(Rout,a0+gap),pC=pol(Rout,a1-gap),pD=pol(Rin-jag,a1-gap);
    var d='M'+pA[0].toFixed(1)+' '+pA[1].toFixed(1)+'L'+pB[0].toFixed(1)+' '+pB[1].toFixed(1)+'L'+pC[0].toFixed(1)+' '+pC[1].toFixed(1)+'L'+pD[0].toFixed(1)+' '+pD[1].toFixed(1)+'Z';
    var lZ=0.82+wallRng()*0.18;
    var col='rgb('+Math.round(196*lZ)+','+Math.round(226*lZ)+','+Math.round(244*lZ)+')';
    var seg=el('path',{d:d,fill:col,'fill-opacity':.9,stroke:'rgba(28,74,104,.45)','stroke-width':.8});
    var mid=(a0+a1)/2, mp=pol((Rin+Rout)/2,mid);
    var dist=80+wallRng()*250;              // stay near the broken wall, not out among the isles
    var jt=(wallRng()*2-1)*60;
    var nrm=mid*Math.PI/180, tng=nrm+Math.PI/2;
    var sx=Math.cos(nrm)*dist + Math.cos(tng)*jt;
    var sy=Math.sin(nrm)*dist + Math.sin(tng)*jt - (24+wallRng()*70);
    segs.push({el:seg,sx:sx,sy:sy,spin:(wallRng()*2-1)*200,fade:0.6+wallRng()*0.38,mcx:mp[0],mcy:mp[1]});
    wallGroup.appendChild(seg);
  }

  /* ---------- crack-light (revealed on break) ---------- */
  var rift=el('circle',{cx:CX,cy:CY,r:(Rin+Rout)/2,fill:'none',stroke:'url(#iwDiscGlow)','stroke-width':4,opacity:0});
  var riftGlow=el('circle',{cx:CX,cy:CY,r:(Rin+Rout)/2,fill:'none',stroke:'#8ff0ff','stroke-width':2,opacity:0,filter:'url(#iwSoft)'});
  mapEl.insertBefore(riftGlow,wallGroup);

  /* ---------- ICE PASS glyph (scene 3) ---------- */
  var passPos=pol(300,-90); // above centre, near inner sea
  var pass=el('g',{});
  pass.appendChild(el('rect',{x:passPos[0]-92,y:passPos[1]-58,width:184,height:116,rx:16,fill:'url(#iwDome)',stroke:'rgba(255,255,255,.5)','stroke-width':2,opacity:.96}));
  pass.appendChild(el('circle',{cx:passPos[0],cy:passPos[1],r:150,fill:'url(#iwDomeGlow)'}));
  pass.appendChild(el('circle',{cx:passPos[0]-52,cy:passPos[1],r:20,fill:'none',stroke:'#0b2b3c','stroke-width':3}));
  pass.appendChild(el('line',{x1:passPos[0]-52,y1:passPos[1]-30,x2:passPos[0]-52,y2:passPos[1]+30,stroke:'#0b2b3c','stroke-width':3}));
  var ptx=el('text',{x:passPos[0]-14,y:passPos[1]-4,'font-family':'IWDisplay','font-size':'20',fill:'#0b2b3c','letter-spacing':'1'});ptx.textContent='ICE';
  var ptx2=el('text',{x:passPos[0]-14,y:passPos[1]+22,'font-family':'IWDisplay','font-size':'20',fill:'#0b2b3c','letter-spacing':'1'});ptx2.textContent='PASS';
  pass.appendChild(ptx);pass.appendChild(ptx2);
  pass.style.opacity='0';
  mapEl.appendChild(pass);

  /* ---------- island builder ---------- */
  var isleUID=0;
  function buildIsle(o,focus){
    var uid='iso'+(isleUID++);
    var p=pol(o.r,o.a), x=p[0], y=p[1], sz=o.size, rng=mulberry32(Math.floor(o.r*7+o.a*13+o.name.length));
    var g=el('g',{});
    var inner=el('g',{'class':reduce?'iw-isle':'iw-isle iw-isle--bob'});
    inner.style.setProperty('--dur',(7+rng()*6).toFixed(1)+'s');
    inner.style.setProperty('--del',(-rng()*8).toFixed(1)+'s');
    // outer glow
    inner.appendChild(el('circle',{cx:x,cy:y,r:sz*1.35,fill:'url(#iwDomeGlow)',opacity:focus?.9:.6}));
    if(o.storm){
      // storm: luminous logarithmic spiral arms + a glowing eye
      var st=el('g',{filter:'url(#iwGlow)'});
      st.appendChild(el('circle',{cx:x,cy:y,r:sz*1.06,fill:'url(#iwStorm)'}));
      var ARMS=5;
      for(var arms=0;arms<ARMS;arms++){
        var aa=arms/ARMS*360, pth='';
        for(var t=0;t<=1.001;t+=0.035){
          var ra=sz*(0.13+t*1.04), an=(aa+t*300)*Math.PI/180;
          var xx=x+ra*Math.cos(an), yy=y+ra*Math.sin(an);
          pth+=(t===0?'M':'L')+xx.toFixed(1)+' '+yy.toFixed(1);
        }
        st.appendChild(el('path',{d:pth,fill:'none',stroke:'rgba(214,244,255,.58)','stroke-width':(sz*0.055).toFixed(1),'stroke-linecap':'round'}));
      }
      st.appendChild(el('circle',{cx:x,cy:y,r:sz*0.22,fill:'#8ff0ff',opacity:.45,filter:'url(#iwSoft)'}));
      st.appendChild(el('circle',{cx:x,cy:y,r:sz*0.12,fill:'#03121c',stroke:'#8ff0ff','stroke-width':2.5}));
      inner.appendChild(st);
    } else {
      // base shadow ellipse
      inner.appendChild(el('ellipse',{cx:x,cy:y+sz*0.86,rx:sz*0.92,ry:sz*0.26,fill:'#020a10',opacity:.5,filter:'url(#iwSoft)'}));
      // dome
      inner.appendChild(el('circle',{cx:x,cy:y,r:sz,fill:o.warm?'url(#iwDomeWarm)':'url(#iwDome)',stroke:'rgba(230,248,255,.45)','stroke-width':1.5}));
      // landmass on dome
      var lm=el('path',{d:blob(x,y+sz*0.06,sz*0.5,.4,8,rng),fill:o.warm?'rgba(70,140,96,.55)':'rgba(28,74,98,.6)',stroke:'rgba(210,240,250,.4)','stroke-width':1});
      var lclip=el('clipPath',{id:'clip_'+uid});var lc=el('circle',{cx:x,cy:y,r:sz-2});lclip.appendChild(lc);defs.appendChild(lclip);
      lm.setAttribute('clip-path','url(#clip_'+uid+')');
      inner.appendChild(lm);
      // specular highlight
      inner.appendChild(el('ellipse',{cx:x-sz*0.34,cy:y-sz*0.4,rx:sz*0.34,ry:sz*0.2,fill:'rgba(255,255,255,.5)',filter:'url(#iwSoft)',opacity:.7}));
      // focus halo
      if(focus){
        inner.appendChild(el('circle',{cx:x,cy:y,r:sz*1.12,fill:'none',stroke:'rgba(120,236,255,.5)','stroke-width':2,'stroke-dasharray':'2 10','stroke-linecap':'round'}));
      }
    }
    g.appendChild(inner);
    // in-world label — smaller/dimmer for featured (the card carries the name); none for the storm
    var labEl=null;
    if(!o.storm){
      var fs = focus ? clamp(sz*0.26,26,40) : clamp(sz*0.42,20,30);
      labEl=el('text',{x:x,y:y+sz*1.32+fs*0.2,'text-anchor':'middle','font-family':'IWDisplay','font-weight':'800','font-size':fs,'letter-spacing':'2',fill:focus?'rgba(226,244,252,.78)':'rgba(180,214,232,.58)'});
      labEl.textContent=o.name;
      g.appendChild(labEl);
    }
    return {g:g,x:x,y:y,sz:sz,label:labEl};
  }

  var islesLayer=el('g',{});
  mapEl.appendChild(islesLayer);
  AMBIENT.forEach(function(o){var b=buildIsle(o,false);islesLayer.appendChild(b.g);});
  var isleXY={}, featLabel={};
  ISLES.forEach(function(o){var b=buildIsle(o,true);islesLayer.appendChild(b.g);isleXY[o.key]={x:b.x,y:b.y,sz:b.sz};if(b.label)featLabel[o.key]=b.label;});

  /* =====================================================================
     SCENES  (camera targets + narrative)
  ===================================================================== */
  function isleCam(key,zBias){
    var p=isleXY[key], z=clamp(430/(p.sz*1.55),1.0,2.5)*(zBias||1);
    return {x:p.x, y:p.y - p.sz*0.16, z:z, rot:0};
  }
  var subMap={amunra:'Fortaleza de los Neptunianos', mu:'Imperio de los Hombres de Piedra', asgard:'El Primer Imperio', eden:'El jardín universal', tiffin:'La frontera sin cartografiar'};

  var SCENES=[
    {cat:'intro',center:1,cam:{x:CX,y:CY,z:0.34,rot:0},
     eyebrow:'EL MUNDO MÁS ALLÁ DEL MURO DE HIELO',
     title:'The map opens<br>as the wall breaks.',
     body:'Everything ever charted sits inside one ring of ice. Beyond it lie the lands no fleet has reached. A thousand fragments crack the wall — scroll to cross it.'},

    {cat:'wall',cam:{x:CX,y:CY,z:0.86,rot:-3},
     eyebrow:'PHASE 00 · THE FOUNDING WALL',
     title:'The ICEWALL',
     stat:['1,000','founding fragments'],
     body:'One wall, sealed since the beginning. Claim a fragment and your name is set into the ice — numbered, permanent, first. A thousand pieces is all it will ever hold.'},

    {cat:'break',cam:{x:CX,y:CY,z:0.6,rot:2},
     eyebrow:'WHEN THE LAST FRAGMENT IS CLAIMED',
     title:'The wall breaks.',
     stat:['0','left when it opens'],
     body:'The moment fragment one-thousand is taken, the ice gives. Cracks race the circumference, the wall lets go — and for the first time the water beyond runs clear.'},

    {cat:'pass',cam:{x:passPos[0],y:passPos[1],z:1.7,rot:-4},
     eyebrow:'STRUCK AT SELL-OUT',
     title:'The ICE PASS',
     body:'From the broken wall the first artifact is struck — one ICE PASS for every founder, etched with your fragment ID. Part membership, part proof you stood at the wall before it opened.'},

    {cat:'place',key:'asgard',
     eyebrow:'PHASE 01 · FIRST LIGHT',
     title:'ASGARD', sub:'El Primer Imperio',
     stat:['2,400','fragments'],
     body:'The first shore past the wall. Ramparts of blue ice over a black sea — the empire that was always said to be out here, finally set on the chart.'},

    {cat:'place',key:'thoth',
     eyebrow:'PHASE 02 · THE ARCHIVE',
     title:'THOTH',
     body:'A low, silent shelf that keeps records older than the wall itself. Every fragment claimed here is written into the same ledger the island is named for.'},

    {cat:'place',key:'atlantida',
     eyebrow:'PHASE 03 · THE RETURN',
     title:'ATLÁNTIDA',
     stat:['3,000','fragments'],
     body:'The coast that sank out of every map surfaces the instant the ice clears. Terraced, flooded, and impossibly intact.'},

    {cat:'place',key:'lemuria',
     eyebrow:'PHASE 04 · THE WIDE CONTINENT',
     title:'GRAN LEMURIA',
     stat:['3,600','largest territory'],
     body:'The broadest landfall on the atlas — drift-ice wide enough for a whole community to gather on. Room to spread out, not just to take a place.'},

    {cat:'place',key:'horus',
     eyebrow:'PHASE 05 · THE WATCH',
     title:'HORUS',
     body:'A single peak that sees the entire circle of the sea. From its summit the whole broken wall is visible at once.'},

    {cat:'place',key:'amunra',sub:'Fortaleza de los Neptunianos',
     eyebrow:'PHASE 06 · THE DEEP FORTRESS',
     title:'AMUN·RA',
     body:'A stronghold set where the deep current turns. The last hold before the outer water — and the first to feel whatever comes in from it.'},

    {cat:'place',key:'aurora',
     eyebrow:'PHASE 07 · THE LIGHTS',
     title:'AURORA',
     body:'Where the sky never fully darkens. The ice here holds colour the way glass holds a flame.'},

    {cat:'place',key:'eden',sub:'El jardín universal',
     eyebrow:'PHASE 08 · THE GARDEN',
     title:'EDÉN',
     stat:['4,200','fragments'],
     body:'Warm ground ringed by cold water — the one green thing beyond the wall. The atlas keeps it for last among the founding lands.'},

    {cat:'place',key:'terranova',
     eyebrow:'PHASE 09 · NEW GROUND',
     title:'TERRA NOVA',
     body:'Unwritten shore. No myth attached, no name older than yours — the first territory that belongs entirely to the people who reach it.'},

    {cat:'place',key:'mu',sub:'Imperio de los Hombres de Piedra',
     eyebrow:'PHASE 10 · THE STONE EMPIRE',
     title:'MU',
     body:'Monoliths standing in the surf, set by hands no record remembers. The oldest silence anywhere on the map.'},

    {cat:'place',key:'valhalla',
     eyebrow:'PHASE 11 · THE FAR HALL',
     title:'VALHALLA',
     body:'The high hall at the cold edge of everything charted. Reaching it is the moment the crossing turns into a story you get to tell.'},

    {cat:'place',key:'tiffin',
     eyebrow:'PHASE 12 · THE FRONTIER',
     title:'LA TORMENTA<br>DE TIFFIN',
     body:'Past the last island the water turns and will not hold still. Everything beyond this storm is still uncharted — the next wall, waiting for its turn to break.'},

    {cat:'final',center:1,cam:{x:CX,y:CY,z:0.3,rot:0},
     eyebrow:'THE CROSSING',
     title:'Claim your fragment.',
     body:'A thousand pieces. One wall. A whole world on the other side of it. Take your place at the boundary before the ice opens.',
     cta:'RESERVE YOUR FRAGMENT — $25'}
  ];
  // resolve island cameras + subs
  SCENES.forEach(function(sc){
    if(sc.cat==='place'){ sc.cam=isleCam(sc.key, sc.key==='tiffin'?0.92:1); }
  });
  var N=SCENES.length;
  // featured labels fade out when you arrive at their own scene (no clash with the card)
  var fadeLabels=[];
  SCENES.forEach(function(sc,i){ if(sc.cat==='place' && featLabel[sc.key]) fadeLabels.push({el:featLabel[sc.key],idx:i}); });

  /* ---------- build cards + spine ---------- */
  var cardsWrap=document.getElementById('iwCards');
  var spineWrap=document.getElementById('iwSpine');
  var cards=[];
  SCENES.forEach(function(sc,i){
    var c=document.createElement('article');
    c.className='iw-card'+(sc.center?' iw-card--center':'')+(sc.cat==='place'?' iw-card--place':'');
    var html='<span class="iw-card__eyebrow">'+sc.eyebrow+'</span>'+
             '<h2 class="iw-card__title">'+sc.title+'</h2>';
    if(sc.sub) html+='<p class="iw-card__sub">'+sc.sub+'</p>';
    if(sc.stat) html+='<div class="iw-card__stat"><em>'+sc.stat[0]+'</em><span>'+sc.stat[1]+'</span></div>';
    html+='<p class="iw-card__body">'+sc.body+'</p>';
    if(sc.cta) html+='<a class="iw-card__cta" href="#" data-cta-link>'+sc.cta+'</a>';
    c.innerHTML=html;
    cardsWrap.appendChild(c);
    cards.push(c);

    var node=document.createElement('button');
    node.type='button'; node.className='iw-atlas__node';
    node.setAttribute('aria-label','Go to '+(sc.title.replace(/<[^>]+>/g,' ')));
    node.addEventListener('click',function(){goTo(i);});
    spineWrap.appendChild(node);
  });
  var nodes=[].slice.call(spineWrap.children);
  document.getElementById('iwTot').textContent='/ '+String(N-1).padStart(2,'0');
  root.style.height=(N*100)+'vh';

  /* ---------- starfield ---------- */
  var starCv=root.querySelector('.iw-atlas__stars'), sctx=starCv.getContext('2d'), stars=[];
  function initStars(){
    var w=starCv.width=starCv.offsetWidth, h=starCv.height=starCv.offsetHeight;
    stars=[]; var n=Math.min(220,Math.floor(w*h/9000));
    var r=mulberry32(42);
    for(var i=0;i<n;i++) stars.push({x:r()*w,y:r()*h,z:r(),ph:r()*6.28});
  }
  function drawStars(t){
    var w=starCv.width,h=starCv.height; sctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var s=stars[i];var tw=reduce?0.7:(0.5+0.5*Math.sin(t*0.001+s.ph));
      sctx.globalAlpha=(0.15+s.z*0.55)*tw; sctx.fillStyle= s.z>0.85?'#bfefff':'#e8f6ff';
      var rad=s.z*1.6+0.3; sctx.beginPath();sctx.arc(s.x,s.y,rad,0,6.283);sctx.fill();}
    sctx.globalAlpha=1;
  }

  /* =====================================================================
     CAMERA + SCROLL
  ===================================================================== */
  var cam={x:CX,y:CY,z:0.34,rot:0};      // current (eased)
  var vw=window.innerWidth, vh=window.innerHeight;
  var world=document.getElementById('iwWorld');
  var iwScrim=document.getElementById('iwScrim');
  var lastBreak=-1;

  function sceneCam(i){return SCENES[i].cam;}
  function interp(p){
    var i=clamp(Math.floor(p),0,N-2), t=smoother(clamp(p-i,0,1));
    var a=sceneCam(i), b=sceneCam(i+1);
    if(p>=N-1){a=b=sceneCam(N-1);t=0;}
    return {
      x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t),
      z:Math.exp(lerp(Math.log(a.z),Math.log(b.z),t)),
      rot:lerp(a.rot,b.rot,t)
    };
  }
  function progress(){
    var r=root.getBoundingClientRect();
    var scrolled=-r.top;
    return clamp(scrolled/vh,0,N-1);
  }

  function applyBreak(b){
    if(reduce){ b=(curP>=2.5)?1:(curP>=1?clamp(curP-1,0,1):0); }
    if(b===lastBreak) return;           // nothing changed — skip the 96-seg loop
    for(var i=0;i<segs.length;i++){
      var s=segs[i];
      if(b<=0){ s.el.setAttribute('transform',''); s.el.setAttribute('opacity',(0.82).toFixed(2)); continue; }
      var tx=(s.sx*b).toFixed(1), ty=(s.sy*b).toFixed(1), rot=(s.spin*b).toFixed(1);
      s.el.setAttribute('transform','translate('+tx+' '+ty+') rotate('+rot+' '+s.mcx.toFixed(1)+' '+s.mcy.toFixed(1)+')');
      s.el.setAttribute('opacity',(1-s.fade*b).toFixed(2));
    }
    wallBody.setAttribute('opacity',(0.98*(1-clamp((b-0.04)/0.6,0,1))).toFixed(3));
    wallGlow.setAttribute('opacity',(0.55*(1-b*0.55)).toFixed(3));
    var rp=clamp((b-0.12)/0.55,0,1);
    riftGlow.setAttribute('opacity',(rp*0.9*(1-b*0.35)).toFixed(3));
    riftGlow.setAttribute('stroke-width',(2+rp*12).toFixed(1));
    lastBreak=b;
  }

  var curP=0;
  function render(t){
    var target=interp(curP);
    if(reduce){ cam.x=target.x;cam.y=target.y;cam.z=target.z;cam.rot=target.rot; }
    else {
      var k=0.14;
      cam.x=lerp(cam.x,target.x,k); cam.y=lerp(cam.y,target.y,k);
      cam.z=Math.exp(lerp(Math.log(cam.z),Math.log(target.z),k));
      cam.rot=lerp(cam.rot,target.rot,k);
    }
    world.style.transform=
      'translate('+(vw/2).toFixed(1)+'px,'+(vh/2).toFixed(1)+'px) '+
      'rotate('+cam.rot.toFixed(3)+'deg) scale('+cam.z.toFixed(4)+') '+
      'translate('+(-cam.x).toFixed(1)+'px,'+(-cam.y).toFixed(1)+'px)';

    // break
    var b=clamp(curP-1,0,1);
    applyBreak(b);

    // pass reveal
    pass.style.opacity=clamp(1-Math.abs(curP-3)/0.8,0,1).toFixed(3);

    // intro scrim (darken map behind the opening title, then lift)
    iwScrim.style.opacity=clamp(1-curP/0.85,0,1).toFixed(3);

    // featured labels fade to nothing on their own scene
    for(var fl=0;fl<fadeLabels.length;fl++){
      fadeLabels[fl].el.setAttribute('opacity', clamp((Math.abs(curP-fadeLabels[fl].idx)-0.2)/0.6,0,1).toFixed(3));
    }

    // cards
    var active=Math.round(curP);
    for(var i=0;i<cards.length;i++){
      var vis=clamp(1-Math.abs(curP-i)/0.55,0,1);
      var cc=cards[i];
      cc.style.opacity=vis.toFixed(3);
      var baseY=SCENES[i].center?'-46%':'0';
      if(SCENES[i].center){ cc.style.transform='translate(-50%,calc(-46% + '+((1-vis)*18).toFixed(1)+'px))'; }
      else { cc.style.transform='translateY('+((1-vis)*16).toFixed(1)+'px)'; }
      cc.style.pointerEvents=vis>0.6?'auto':'none';
    }
    // chrome + spine
    document.getElementById('iwNow').textContent=String(clamp(active,0,N-1)).padStart(2,'0');
    for(var n2=0;n2<nodes.length;n2++){ nodes[n2].style.setProperty('--on', clamp(1-Math.abs(curP-n2)/0.6,0,1).toFixed(3)); }
    // cue
    cueBtn.style.opacity=clamp(1-curP/0.5,0,1).toFixed(3);
    cueBtn.style.pointerEvents=curP<0.4?'auto':'none';

    if(!reduce) drawStars(t||0);
    raf=requestAnimationFrame(render);
  }

  /* ---------- scroll wiring ---------- */
  var raf, cueBtn=document.getElementById('iwCue');
  function onScroll(){ curP=progress(); }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){vw=window.innerWidth;vh=window.innerHeight;initStars();onScroll();},{passive:true});

  function goTo(i){
    var top=root.offsetTop + i*vh;
    window.scrollTo({top:top,behavior:reduce?'auto':'smooth'});
  }
  cueBtn.addEventListener('click',function(){goTo(1);});
  root.setAttribute('tabindex','-1');
  window.addEventListener('keydown',function(e){
    if(['ArrowDown','PageDown',' '].indexOf(e.key)>=0){ e.preventDefault(); goTo(clamp(Math.round(curP)+1,0,N-1)); }
    else if(['ArrowUp','PageUp'].indexOf(e.key)>=0){ e.preventDefault(); goTo(clamp(Math.round(curP)-1,0,N-1)); }
    else if(e.key==='Home'){ e.preventDefault(); goTo(0); }
    else if(e.key==='End'){ e.preventDefault(); goTo(N-1); }
  });

  /* ---------- go ---------- */
  initStars(); onScroll(); curP=progress(); cam=Object.assign({},interp(curP));
  raf=requestAnimationFrame(render);
})();
</script>
